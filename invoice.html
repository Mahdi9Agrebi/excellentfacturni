<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مولّد الفاتورة (PDF)</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <h2>مولّد الفاتورة (PDF)</h2>

    <div style="max-width:400px;margin:20px auto;text-align:right;">
        <label>اسم العميل:</label>
        <input id="client" type="text" style="width:100%;padding:8px;margin-bottom:10px;">
        
        <label>المبلغ:</label>
        <input id="amount" type="text" style="width:100%;padding:8px;margin-bottom:10px;">
        
        <button class="tool-btn" onclick="generatePDF()">إنشاء الفاتورة</button>
    </div>

    <a class="back" href="tools.html">⬅ العودة إلى صفحة الأدوات</a>

    <script>
        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const client = document.getElementById("client").value || "اسم العميل";
            const amount = document.getElementById("amount").value || "0";

            doc.text("فاتورة مبيعات", 90, 20);
            doc.text("اسم العميل: " + client, 20, 40);
            doc.text("المبلغ: " + amount + " ريال", 20, 50);
            doc.text("شكرًا لتعاملكم معنا 💙", 20, 70);

            doc.save("فاتورة.pdf");
        }
    </script>
</body>
</html>
