<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مساعد الذكاء الاصطناعي</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background: linear-gradient(to bottom right, #2b6cb0, #63b3ed);
      color: #333;
      text-align: center;
      padding: 20px;
      min-height: 100vh;
    }

    h2 {
      color: white;
      margin-bottom: 15px;
    }

    .chat-box {
      background: #fff;
      width: 320px;
      height: 400px;
      margin: auto;
      border-radius: 12px;
      padding: 15px;
      overflow-y: scroll;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
      text-align: right;
    }

    .message {
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background-color: #ebf8ff;
      align-self: flex-end;
      text-align: right;
      margin-left: auto;
    }

    .bot {
      background-color: #f0fff4;
      text-align: right;
    }

    .input-area {
      margin-top: 15px;
    }

    input {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 220px;
    }

    button {
      padding: 8px 15px;
      background-color: #2b6cb0;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #245a8d;
    }

    a.back {
      display: block;
      margin-top: 15px;
      color: #fff;
      text-decoration: none;
    }

    a.back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>🤖 مرحبًا، أنا مساعدك الذكي</h2>
  <p style="color:white;">كيف يمكنني مساعدتك اليوم؟</p>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." />
    <button onclick="sendMessage()">إرسال</button>
  </div>

  <a class="back" href="tools.html">🔙 العودة إلى صفحة الأدوات</a>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");

    function sendMessage() {
      const text = userInput.value.trim();
      if (text === "") return;

      const userMsg = document.createElement("div");
      userMsg.classList.add("message", "user");
      userMsg.textContent = text;
      chatBox.appendChild(userMsg);

      userInput.value = "";

      setTimeout(() => {
        const botMsg = document.createElement("div");
        botMsg.classList.add("message", "bot");

        if (text.includes("مرحبا") || text.includes("السلام")) {
          botMsg.textContent = "أهلًا وسهلًا 👋 كيف حالك اليوم؟";
        } else if (text.includes("مساعدة")) {
          botMsg.textContent = "أنا هنا لمساعدتك 🧠 فقط اكتب ما تريد معرفته.";
        } else if (text.includes("شكرا") || text.includes("شكراً")) {
          botMsg.textContent = "العفو 🙏 هذا واجبي!";
        } else {
          botMsg.textContent = "🤔 أممم.. لم أفهم تمامًا، لكني أتعلم بسرعة!";
        }

        chatBox.appendChild(botMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 600);
    }
  </script>
</body>
</html>
